services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: app_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./src/db/migrations:/docker-entrypoint-initdb.d:ro

  db_test:
      image: postgres:16
      environment:
        POSTGRES_USER: app
        POSTGRES_PASSWORD: secret
        POSTGRES_DB: app_test
      ports:
        - "5433:5432"
      volumes:
        - ./src/db/migrations:/docker-entrypoint-initdb.d:ro
      tmpfs:
        - /var/lib/postgresql/data

volumes:
  postgres_data:
